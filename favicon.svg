        <circle cx="20" cy="18" r="16" fill="#2747ff" />
        <circle cx="46" cy="20" r="15" fill="#ff5fc8" />
        <circle cx="44" cy="46" r="16" fill="#ff9a1c" />
        <circle cx="18" cy="46" r="14" fill="#14b3c4" />
        <circle cx="32" cy="32" r="10" fill="#b54ee0" />
      </g>
    </g>
  </g>
</svg>
